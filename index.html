<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kana Monster</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Home: pick mode, session type and generations, then start -->
<div id="home" class="view">
  <header class="bar">
    <div class="brand"><span class="logo" lang="ja">カ</span><span class="wordmark">KANA MONSTER</span></div>
    <div class="bar-end">
      <div class="seg lang-seg wide-only" id="lang-bar"></div>
      <button class="icon-btn" id="open-settings"></button>
    </div>
  </header>
  <main class="home">
    <section class="home-main">
      <h1 class="home-title wide-only" id="home-title"></h1>
      <section class="group" id="mode-group">
        <h2 class="label" id="mode-label"></h2>
        <div class="modes" id="modes"></div>
      </section>
      <section class="group" id="method-group">
        <h2 class="label" id="method-label"></h2>
        <div class="method" id="method"></div>
      </section>
      <div class="start-row">
        <button class="btn primary" id="start"></button>
        <span class="or-press wide-only" id="or-press"></span>
      </div>
    </section>
    <aside class="home-side">
      <section class="panel stats" id="stats"></section>
      <section class="group gens-group">
        <div class="label-row"><h2 class="label" id="gens-label"></h2><span class="label-note" id="gens-count"></span></div>
        <div class="gens" id="gens"></div>
      </section>
    </aside>
  </main>
</div>

<!-- A running practice set or challenge -->
<div id="session" class="view" hidden>
  <header class="bar session-bar">
    <button class="exit" id="exit"></button>
    <div class="track" id="track"></div>
    <span class="count" id="count"></span>
  </header>
  <div class="subbar" id="subbar" hidden></div>
  <main class="session">
    <section class="card" id="app"></section>
    <aside class="session-side wide-only">
      <section class="panel" id="history"></section>
      <section class="panel" id="keys"></section>
    </aside>
  </main>
</div>

<dialog id="settings">
  <div class="sheet-grip"></div>
  <header class="sheet-head"><h2 id="settings-title"></h2><button class="link-btn" id="close-settings"></button></header>
  <h3 class="label" id="lang-label"></h3>
  <div class="seg lang-seg" id="lang-sheet"></div>
  <label class="toggle-row"><span><b id="cue-label"></b><small id="cue-desc"></small></span><input type="checkbox" id="cue"></label>
  <label class="toggle-row"><span><b id="speak-label"></b><small id="speak-desc"></small></span><input type="checkbox" id="autospeak"></label>
  <h3 class="label" id="shortcuts-label"></h3>
  <dl class="shortcuts" id="shortcuts"></dl>
  <p class="credits" id="credits"></p>
</dialog>

<!-- Classic scripts sharing globals, loaded in this order, so the page also works opened from disk
     (file://), where Chrome refuses ES modules. -->
<script src="js/romaji.js"></script>
<script src="js/i18n.js"></script>
<script src="js/names.js"></script>
<script src="js/deck.js"></script>
<script src="js/strokes.js"></script>
<script src="js/read.js"></script>
<script src="js/write.js"></script>
<script src="js/sessions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
