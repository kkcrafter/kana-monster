<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kana Monster</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Kana Monster</h1>
  <div id="stats"></div>
</header>

<div id="controls">
  <div id="gens"></div>
  <div id="row2">
    <div id="row3">
      <div id="sessions"></div>
      <label id="count-wrap"><input type="number" id="count" min="1" max="200"> <span id="count-label"></span></label>
      <label id="mins-wrap"><input type="number" id="mins" min="1" max="60"> <span id="mins-label"></span></label>
    </div>
    <div id="langs"></div>
  </div>
  <div id="modes"></div>
  <div id="toggles">
    <label><input type="checkbox" id="cue"> <span id="cue-label"></span></label>
    <label><input type="checkbox" id="autospeak"> <span id="speak-label"></span></label>
    <label id="guide-wrap"><input type="checkbox" id="guide"> <span id="guide-label"></span></label>
    <label id="nums-wrap"><input type="checkbox" id="nums"> <span id="nums-label"></span></label>
  </div>
</div>

<div id="sessionbar"></div>

<main id="app">
  <div id="kana">…</div>
</main>

<footer id="footer"></footer>

<!-- Classic scripts sharing globals, loaded in this order, so the page also works opened from disk
     (file://), where Chrome refuses ES modules. -->
<script src="js/romaji.js"></script>
<script src="js/i18n.js"></script>
<script src="js/names.js"></script>
<script src="js/deck.js"></script>
<script src="js/strokes.js"></script>
<script src="js/write.js"></script>
<script src="js/sessions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
